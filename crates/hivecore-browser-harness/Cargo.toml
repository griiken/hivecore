[package]
name = "hivecore-browser-harness"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
hivecore-runtime-core = { path = "../hivecore-runtime-core" }
hivecore-browser-core = { path = "../hivecore-browser-core" }

async-trait = "0.1"
tokio = { version = "1", features = ["sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
hivecore-browser-runtime = { path = "../hivecore-browser-runtime" }
anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"
