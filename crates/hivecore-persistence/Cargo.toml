[package]
name = "hivecore-persistence"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
hivecore-runtime-core = { path = "../hivecore-runtime-core" }
async-trait = "0.1"
tokio = { version = "1", features = ["fs", "sync", "io-util", "macros", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
hivecore-agent-loop = { path = "../hivecore-agent-loop" }
hivecore-openai-adapter = { path = "../hivecore-openai-adapter" }
hivecore-builtin-tools = { path = "../hivecore-builtin-tools" }
hivecore-execution-env = { path = "../hivecore-execution-env" }
