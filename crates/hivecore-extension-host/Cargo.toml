[package]
name = "hivecore-extension-host"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
hivecore-runtime-core = { path = "../hivecore-runtime-core" }
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "macros", "rt", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"

# WASM Component Model runtime + WASI.
wasmtime = { version = "27", features = ["component-model"] }
wasmtime-wasi = "27"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
