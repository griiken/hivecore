[package]
name = "hivecore-mcp-client"
version = "0.0.0"
edition = "2021"
publish = false
description = "Opt-in MCP client for hivecore harnesses (ADR-027). Lazy 3-meta-tool default; eager mode opt-in."

[lib]
path = "src/lib.rs"

[dependencies]
hivecore-runtime-core = { path = "../hivecore-runtime-core" }

async-trait = "0.1"
tokio = { version = "1", features = ["sync", "macros", "rt", "process", "time"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
tracing = "0.1"
sha1 = "0.10"
hex = "0.4"

rmcp = { version = "0.8", default-features = false, features = [
    "client",
    "server",
    "macros",
    "schemars",
    "base64",
    "transport-child-process",
    "transport-io",
] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
which = "6"
